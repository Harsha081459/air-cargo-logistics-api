name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Test
        run: python -m pytest -q

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Start fresh demo stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Exercise API and MySQL transactions
        run: python -m pytest tests/test_database.py -q
        env:
          RUN_DB_INTEGRATION: "1"
          DB_PASSWORD: rootpassword
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop demo stack
        if: always()
        run: docker compose stop
